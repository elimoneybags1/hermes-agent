# The locked base layer for every Hermes profile on this machine.
#
# integrations/bin/hermes points HERMES_MANAGED_DIR at this directory, so Hermes
# deep-merges these values ON TOP of each profile's own config.yaml, per leaf.
# A profile can change everything else; it cannot change a key set here.
# Edit this file from the Team repo, commit it, and every profile picks the
# change up on its next launch.
#
# Main (the default profile) is the overall configuration and every project
# profile is main plus its own additions. This file is how main's settings reach
# every profile: the gateway connection, the free-only rule, and every setting
# main shares. A project adds keys of its own (terminal.cwd, mcp_servers, ...)
# in its profile's config.yaml; it cannot change one set here. To change a
# shared setting, change it here, not with /config in a main session.
#
# Lists are not set here: a list in this layer replaces a profile's list whole,
# so a project could not add to it. integrations/hermes/inherit.py unions main's
# lists (plugins.enabled, command_allowlist, skills.external_dirs) into each
# project profile instead, and builds its SOUL.md from main's.

model:
  provider: litellm
  default: tier-auto
  streaming: false

providers:
  litellm:
    model: tier-auto
    api_key: ${LITELLM_MASTER_KEY}
    api_mode: chat_completions
    base_url: http://127.0.0.1:4000/v1
    context_length: 131072
    key_env: LITELLM_MASTER_KEY
    # A list here is an allowlist: Hermes's pickers show only these ids
    # (hermes_cli/model_switch.py::_models_config_is_allowlist). The Claude
    # models are listed by name because Claude is chosen by name, never by
    # tier-auto; each one draws on the Max subscription allowance.
    models:
      - tier-auto
      - tier-simple
      - tier-medium
      - tier-complex
      - tier-reasoning
      - tier-claude
      - claude-haiku-5-5
      - claude-sonnet-5-5
      - claude-opus-5-5
      - claude-fable-5-1
    session_affinity_header: x-litellm-session-id

fallback_providers: []

delegation:
  provider: litellm
  model: tier-auto
  fallback_providers: []

cron:
  model_provider: litellm
  model: tier-auto

# Every helper lane runs on the gateway's simple tier.
auxiliary:
  free_only: true
  approval: {provider: litellm, model: tier-simple}
  background_review: {provider: litellm, model: tier-simple, enabled: false}
  compression: {provider: litellm, model: tier-simple}
  curator: {provider: litellm, model: tier-simple}
  goal_judge: {provider: litellm, model: tier-simple}
  kanban_decomposer: {provider: litellm, model: tier-simple}
  mcp: {provider: litellm, model: tier-simple}
  memory_query_rewrite: {provider: litellm, model: tier-simple}
  moa_aggregator: {provider: litellm, model: tier-simple}
  moa_reference: {provider: litellm, model: tier-simple}
  monitor: {provider: litellm, model: tier-simple}
  profile_describer: {provider: litellm, model: tier-simple}
  review: {provider: litellm, model: tier-simple}
  skills_hub: {provider: litellm, model: tier-simple}
  title_generation: {provider: litellm, model: tier-simple}
  triage_specifier: {provider: litellm, model: tier-simple}
  tts_audio_tags: {provider: litellm, model: tier-simple}
  vision: {provider: litellm, model: tier-simple}
  voice_chat: {provider: litellm, model: tier-simple}

compression:
  enabled: true
  threshold: 0.5

curator:
  enabled: false

# One kanban board, orchestrated by main.
kanban:
  auto_decompose: false
  default_assignee: default
  dispatch_in_gateway: false
  failure_limit: 2
  max_in_progress: 3
  orchestrator_profile: default
  review_dispatch: false

approvals:
  mode: "off"
  destructive_slash_confirm: false

# Per-profile, never here: terminal.cwd (the project's folder), gateway.* (main
# hosts the gateway), telemetry, onboarding and moa state (Hermes writes those
# itself), _config_version, and the lists above.
