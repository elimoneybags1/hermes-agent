name = "onboard"
title = "Onboarding"
does = "The first job on a new repo: finds how it is built, linted and tested, writes a smoke check if it has none, and proposes the target's check, test runner, e2e and setup commands with a way to prove the check can fail."
graded_by = "Code (gate onboard): the proposed check passes in the worktree as it stands, fails after the proposed break command, and passes again once the break is undone. Eli approves the settings before they apply."
status = "active"
gate = "onboard"
# The onboarding pipeline runs this stage; the lead never assigns it.
assignable = false
tools = ["terminal", "file", "todo", "skills", "kanban"]

[runs_on]
harness = "hermes"

[escalation]
harness = "hermes-subscription"
model = "claude-sonnet-5-5"
after_failures = 1

[budget]
max_turns = 40
run_budget_s = 900

[models]
candidates = ["tier-complex", "tier-medium"]
pinned = ""

[hermes.compression]
threshold = 0.25
