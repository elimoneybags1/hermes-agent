name = "security"
title = "Security scan"
does = "Reads a security-type part's diff for what must never land unnoticed (secrets, injection, disabled checks, new endpoints or dependencies, widened permissions) and reports; Eli reads the report before anything lands."
graded_by = "Code (gate security): the answer is a JSON report whose findings each cite a line the diff added or changed, and the branch is unchanged since the stage began. The verdict is never the model's: the goal always waits for Eli."
status = "planned"
gate = "security"
assignable = false
tools = ["read-only", "kanban"]

[runs_on]
harness = "hermes"

[escalation]
harness = "hermes-subscription"
model = "claude-sonnet-5-5"
after_failures = 1

[budget]
max_turns = 15
run_budget_s = 600

[models]
candidates = ["tier-complex", "tier-medium"]
pinned = ""

[hermes.compression]
threshold = 0.25
