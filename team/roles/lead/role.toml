name = "lead"
title = "Lead"
does = "Splits a goal into parts and writes each free worker's work order: steps, owned files, the code to read, toolsets, skills and model. Reads failures and steers the retry."
graded_by = "Team validates every plan and diagnosis in code (team/lead.py) before a worker sees it; the parts' checks grade the outcome."
status = "active"
# The isolated runner exposes only read_file and search_files.
tools = ["read-only"]

[runs_on]
harness = "hermes-subscription"
model = "claude-sonnet-5-5"

[budget]
max_turns = 30
run_budget_s = 900
