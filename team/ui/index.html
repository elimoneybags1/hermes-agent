// ---- Runtime rendering: what the Hermes runtime is doing (team/runtime.py) ----
function runtimeView() {
  if (S.runtimeErr) return html`<div class="empty"><span class="msg err">Can't load /api/runtime: ${S.runtimeErr}</span></div>`;
  if (S.runtime === null) return html`<div class="empty">Loading runtime…</div>`;
  const rt = S.runtime, run = rt.run || {}, calls = rt.calls || { window_h: 24, providers: [] };
  const provs = calls.providers || [];
  const runPill = run.alive
    ? html`<span class="pill pass">alive${run.pids && run.pids.length ? html` · pid ${run.pids.join(', ')}` : ''}</span>`
    : html`<span class="pill fail">stopped</span>`;
  const callsHtml = provs.length
    ? html`<table><tr><th>Provider</th><th>Model</th><th>Calls</th><th>OK</th><th>Tokens in</th><th>Tokens out</th><th>API requests</th><th>Last</th></tr>${provs.map(p => html`<tr><td class="mono">${p.provider}</td><td class="mono" title="${p.model}">${shortModel(p.model)}</td><td class="num">${p.calls}</td><td class="num">${p.ok}/${p.calls}</td><td class="num">${num(p.tokens_in)}</td><td class="num">${num(p.tokens_out)}</td><td class="num">${num(p.api_calls)}</td><td class="num" title="${p.last_ts || ''}">${ago(p.last_ts)}</td></tr>`)}</table>`
    : html`<div class="empty small">No model calls recorded in the ledger in the last ${calls.window_h}h.</div>`;
  const nActive = rt.profiles.reduce((n, p) => n + ((p.sessions && p.sessions.active) || 0), 0);
  const nProposed = rt.proposals.filter(p => p.status === 'proposed').length;
  return html`<div class="pane-head">
      <div class="pane-title"><span class="sdot ${run.alive ? 'working' : 'planned'}"></span><h1>Runtime</h1><span class="pane-sub">Hermes profiles, sessions, model calls, optimizer proposals</span></div>
      <div class="pane-meta">
        <span class="chip">team run ${run.alive ? 'alive' : 'stopped'}</span>
        <span class="chip">${rt.profiles.length} profile${rt.profiles.length === 1 ? '' : 's'}${nActive ? ` · ${nActive} active session${nActive === 1 ? '' : 's'}` : ''}</span>
        <span class="chip">${nProposed} open proposal${nProposed === 1 ? '' : 's'}</span>
        <span class="chip mono" title="state dir">${rt.state_dir}</span>
      </div>
    </div>
    <div id="tabbody" class="tabbody">
      <h3 style="margin-top:0">Loop</h3>
      <div class="fields">
        <div class="field"><div class="label">team run</div><div class="fv">${runPill}<span class="small muted">Jobs on the board only advance while a <span class="mono">team run</span> process exists. Start one with <span class="mono">team run</span>, or <span class="mono">team open</span> from the boss pane.</span></div></div>
        <div class="field"><div class="label">Snapshot</div><div class="fv"><span class="val" title="${rt.generated_at}">${ago(rt.generated_at)}</span></div></div>
      </div>
      <h3>Model calls, last ${calls.window_h}h</h3>
      ${callsHtml}
      <h3>Hermes profiles</h3>
      ${rt.profiles.length ? rt.profiles.map(profileCard) : html`<div class="empty small">No Hermes profiles yet under <span class="mono">${rt.state_dir}/hermes/profiles</span>. The first <span class="mono">team</span> or <span class="mono">team optimize</span> run creates one.</div>`}
      <h3>Optimizer proposals</h3>
      ${rt.proposals.length ? rt.proposals.map(proposalCard) : html`<div class="empty small">No saved recommendations yet. <span class="mono">team optimize</span> writes them.</div>`}
    </div>`;
}

function resumeCmd(role, id) {
  if (role === 'boss') return `team -- --resume ${id}`;
  if (role === 'optimizer') return `team optimize --resume ${id}`;
  return null;
}

function profileCard(p) {
  const s = p.sessions || { count: 0, active: 0, items: [], error: null };
  const m = p.model || {};
  const logs = p.logs || {};
  const rows = (s.items || []).map(x => {
    const open = S.sessionOpen === x.id;
    const status = x.active
      ? html`<span class="pill active">active</span>`
      : html`<span class="pill ended" title="${x.end_reason || ''}">${x.end_reason || 'ended'}</span>`;
    const resume = resumeCmd(p.role, x.id);
    return html`<tr class="rt-row" data-act="session" data-id="${x.id}" title="${x.id}">
        <td class="num" title="${x.started_at || ''}">${ago(x.started_at)}</td>
        <td>${x.title || html`<span class="muted">untitled</span>`}</td>
        <td>${status}</td>
        <td class="mono">${shortModel(x.model)}</td>
        <td class="num">${x.message_count}</td>
        <td class="num">${x.tool_call_count}</td>
        <td class="num">${x.api_call_count}</td>
        <td class="num">${num(x.input_tokens)} / ${num(x.output_tokens)}</td>
        <td class="num">${x.ended_at ? between(x.started_at, x.ended_at) : since(x.started_at)}</td>
      </tr>${open ? html`<tr><td colspan="9" class="rt-detail">
        <div><span class="mono">${x.id}</span>${x.cwd ? html` · ${x.cwd}` : ''}${x.git_branch ? html` · ${x.git_branch}` : ''}</div>
        ${x.last_activity ? html`<div class="muted">${x.last_activity}${x.last_activity_at ? html` · ${ago(x.last_activity_at)}` : ''}</div>` : ''}
        ${resume ? html`<div class="muted">Resume: <span class="mono">${resume}</span></div>` : ''}
      </td></tr>` : ''}`;
  });
  const dot = s.active ? 'working' : (s.count ? 'active' : 'planned');
  const agent = roleOf(p.role);
  return html`<div class="rt-card"${hl('profile:' + p.role)}>
    <div class="rt-head">
      <span class="sdot ${dot}"></span><span class="rt-name">${p.role}</span>
      <span class="chip mono" title="provider / model">${m.provider || '—'} / ${m.default || '—'}</span>
      <span class="chip">${s.count} session${s.count === 1 ? '' : 's'}${s.active ? ` · ${s.active} active` : ''}</span>
      <span class="chip">${p.memories} memor${p.memories === 1 ? 'y' : 'ies'}</span>
      <span class="chip" title="${(p.team_skills || []).join(', ')}">${(p.team_skills || []).length} team skill${(p.team_skills || []).length === 1 ? '' : 's'}</span>
      <span class="spacer"></span>
      ${agent ? html`<button class="btn ghost" data-act="open" data-name="${p.role}" style="font-size:12px;">Open agent</button>` : ''}
    </div>
    ${s.error ? html`<div class="banner" style="margin-top:8px">Can't read sessions: ${s.error}</div>` : ''}
    ${rows.length
      ? html`<table class="rt-table"><tr><th>Started</th><th>Title</th><th>Status</th><th>Model</th><th>Msgs</th><th>Tools</th><th>API</th><th>Tokens in / out</th><th>Took</th></tr>${rows}</table>`
      : html`<div class="muted small rt-none">No Hermes sessions yet for ${p.role}.</div>`}
    <div class="rt-logs">${logLine('agent.log', logs['agent.log'], false)}${logLine('errors.log', logs['errors.log'], true)}</div>
  </div>`;
}

function logLine(name, l, isErr) {
  if (!l) return html`<div class="rt-log muted"><span class="mono">${name}</span><span>none</span></div>`;
  const t = parseTs(l.mtime), hot = isErr && t != null && Date.now() - t < 3600 * 1000;
  return html`<div class="rt-log${hot ? ' hot' : ''}"><span class="mono">${name}</span><span class="muted" title="${l.mtime || ''}">${ago(l.mtime)}</span><span class="rt-last" title="${l.last}">${l.last}</span></div>`;
}

function proposalCard(p) {
  const open = S.proposalOpen === p.id, status = p.status || 'proposed';
  const short = v => String(v || '').slice(0, 8);
  return html`<div class="rt-card"${hl('proposal:' + p.id)}>
    <div class="rt-head">
      <span class="pill ${status}">${status}</span>
      <span class="rt-subject">${p.subject}</span>
      <span class="muted small" title="${p.created_at || ''}">${ago(p.created_at)}</span>
      <button class="btn ghost" data-act="proposal" data-id="${p.id}" style="font-size:12px;">${open ? 'Hide' : 'Details'}</button>
    </div>
    <div class="small muted rt-scope"><b>Scope</b> ${p.scope} · <b>Where</b> <span class="mono">${p.location}</span>${p.supersedes ? html` · supersedes <span class="mono" title="${p.supersedes}">${short(p.supersedes)}</span>` : ''}${p.superseded_by ? html` · superseded by <span class="mono" title="${p.superseded_by}">${short(p.superseded_by)}</span>` : ''} · ${p.evidence_count} evidence record${p.evidence_count === 1 ? '' : 's'}</div>
    ${open ? html`<div class="fields rt-fields">
      ${[['Before', p.before], ['After', p.after], ['Reason', p.reason], ['Validation', p.validation], ['Uncertainty', p.uncertainty]].map(([k, v]) => html`<div class="field"><div class="label">${k}</div><div class="fv"><div class="val">${v || '—'}</div></div></div>`)}
      <div class="field"><div class="label">Evidence</div><div class="fv"><div class="val mono small">${(p.evidence_ids || []).join(', ') || '—'}</div></div></div>
      <div class="field"><div class="label">File</div><div class="fv"><div class="val mono small">${S.runtime.state_dir}/optimizer/proposals/${p.id}.json</div></div></div>
    </div>
    <div class="small muted rt-foot">A proposal is advice. Nothing applies it until you decide to, and a change only lands if it beats the current pass rate on the replay set.</div>` : ''}
  </div>`;
}

// ---- Flow rendering: goals through the team (team/flow.py), drawn like the Hermes kanban board ----
function goalModel(g) {
  const m = g.model || {};
  return (m.behind_proxy && m.behind_proxy.model) || m.model || '';
}
// Dot colours follow the kanban board: green working, amber waiting on something,
// red blocked, cyan under review, blue done, lilac still being planned, grey queued.
function dotOf(stage) { return stage; }
function stageWord(g) {
  if (g.stage === 'running') return g.task_started ? `running ${since(g.task_started)}` : 'running';
  if (g.stage === 'waiting') return `waits for ${g.parents.length === 1 ? '1 task' : g.parents.length + ' tasks'}`;
  if (g.stage === 'queued') return 'next up';
  if (g.stage === 'review') return 'grading';
  if (g.stage === 'blocked') return g.block_kind ? `blocked · ${g.block_kind}` : 'blocked';
  if (g.stage === 'landed') return `landed ${since(g.finished)} ago`;
  if (g.stage === 'failed') return `${g.outcome || 'failed'} ${since(g.finished)} ago`;
  return g.stage;
}
function miniTrack(g) {
  return html`<div class="ktrack">${g.track.map(t => html`<span class="${t.state}${t.state === 'current' ? ' ' + g.stage : ''}" title="${t.station}: ${t.state}"></span>`)}</div>`;
}
function kcard(g) {
  const m = g.model || {}, model = goalModel(g);
  const sel = S.goalOpen === g.id;
  return html`<div class="kcard ${g.stage}${sel ? ' sel' : ''}" data-act="goal" data-id="${g.id}"${hl('goal:' + g.id)} title="goal ${g.id}: ${g.title}">
    <div class="krow"><span class="kdot ${dotOf(g.stage)}"></span><span class="kid">#${g.id}${g.plan_task ? ' · ' + g.plan_task : ''}</span>${g.attempt > 1 ? html`<span class="kid">attempt ${g.attempt}</span>` : ''}<span class="kid" style="margin-left:auto">${g.target}</span></div>
    <div class="ktitle">${g.title}</div>
    <div class="kmeta"><span>${stageWord(g)}</span>${g.parents.length && g.stage === 'waiting' ? html`<span class="dep" title="kanban holds it until ${g.parents.join(', ')} are done">↳ ${g.parents.map(p => p.slice(0, 8)).join(' ')}</span>` : ''}
      <span class="right">${model ? html`<span class="model${m.live ? ' live' : ''}" title="${m.live ? 'running on ' : 'last on '}${model}${m.behind_proxy ? ' (behind ' + m.model + ')' : ''}">${shortModel(model)}</span>` : ''}</span></div>
    ${miniTrack(g)}
  </div>`;
}
function lane(label, cards, empty) {
  return html`<div class="kb-lane"><div class="kb-lane-head">${label}<span class="n">${cards.length}</span></div>${cards.length ? cards.map(kcard) : html`<div class="kb-empty">${empty}</div>`}</div>`;
}
function flowView() {
  if (S.flowErr) return html`<div class="empty"><span class="msg err">Can't load /api/flow: ${S.flowErr}</span></div>`;
  if (S.flow === null) return html`<div class="empty">Loading the flow…</div>`;
  const fl = S.flow, c = fl.counts, run = S.state && S.state.run;
  const agents = new Map(fl.agents.map(a => [a.name, a]));
  const landed = fl.goals.filter(g => g.stage === 'landed'), failed = fl.goals.filter(g => g.stage === 'failed');
  const cols = fl.stations.map(st => {
    if (st === 'boss') {
      const a = agents.get('boss') || {};
      const plans = fl.plans.map(p => html`<div class="kcard plan" data-act="plan-open" data-id="${p.id}" title="${p.objective}">
        <div class="krow"><span class="kdot plan"></span><span class="kid">plan · rev ${p.revision}</span><span class="kid" style="margin-left:auto">${p.target || ''}</span></div>
        <div class="ktitle">${p.objective || '(no objective yet)'}</div>
        <div class="kmeta"><span>${p.dispatched}/${p.tasks.length} tasks sent</span><span class="right">${ago(p.updated_at || p.created_at)}</span></div>
      </div>`);
      return html`<div class="kb-col">
        <div class="kb-head"><span class="kdot ${a.status === 'active' ? 'running' : 'queued'}"></span>boss<span class="n">${fl.plans.length}</span><button class="btn ghost" data-act="open" data-name="boss">Talk</button></div>
        <div class="kb-sub"><span class="mono">${a.title || ''} · ${shortModel(a.model)}</span></div>
        <div class="kb-body">
          <div class="kb-lane"><div class="kb-lane-head">Planning<span class="n">${fl.plans.length}</span></div>${plans.length ? plans : html`<div class="kb-empty">no plans yet · talk to the boss</div>`}</div>
          <div class="kb-lane"><div class="kb-lane-head">Sent to the team<span class="n">${c.made}</span></div></div>
        </div>
      </div>`;
    }
    if (st === 'landed') {
      return html`<div class="kb-col landed">
        <div class="kb-head"><span class="kdot landed"></span>landed<span class="n">${c.landed}</span></div>
        <div class="kb-sub"><span class="mono">merged into the target</span></div>
        <div class="kb-body">${lane('Done', landed.slice(0, 8), 'nothing landed yet')}${landed.length > 8 ? html`<div class="kb-empty">+${landed.length - 8} more</div>` : ''}${failed.length ? lane('Failed', failed.slice(0, 4), '') : ''}</div>
      </div>`;
    }
    const a = agents.get(st) || { running: [], queued: [], blocked: [], done: [], status: 'planned' };
    const live = a.live_model;
    const slim = a.status !== 'active' && !a.running.length && !a.queued.length && !a.blocked.length;
    const recent = a.done.filter(g => g.stage === 'landed').slice(0, 3);
    return html`<div class="kb-col${slim ? ' slim' : ''}">
      <div class="kb-head"><span class="kdot ${a.running.length ? 'running' : (a.status === 'active' ? 'queued' : 'planned')}"></span>${st}<span class="n">${a.running.length + a.queued.length + a.blocked.length}</span><button class="btn ghost" data-act="open" data-name="${st}">Open</button></div>
      <div class="kb-sub"><span class="mono${live ? ' live' : ''}" title="${live ? 'running on ' + live : 'configured ' + (a.model || '')}">${a.title || st}${slim ? '' : ' · ' + shortModel(live || a.model)}</span></div>
      <div class="kb-body">
        ${lane('In progress', a.running, 'idle')}
        ${a.blocked.length ? lane('Blocked', a.blocked, '') : ''}
        ${lane('To do', a.queued, 'nothing waiting')}
        ${recent.length ? lane('Done', recent, '') : ''}
      </div>
    </div>`;
  });
  const openGoal = S.goalOpen != null ? fl.goals.find(g => g.id === S.goalOpen) : null;
  return html`<div class="pane-head">
      <div class="pane-title"><span class="sdot ${c.running ? 'working' : 'active'}"></span><h1>Flow</h1><span class="pane-sub">goals through the team, live</span></div>
      <div class="pane-meta">
        <span class="chip">${run ? (run.alive ? 'team run alive' : 'team run stopped: goals wait') : ''}</span>
        <span class="chip">${c.made} made</span><span class="chip${c.running ? ' busy' : ''}">${c.running + c.review} running</span><span class="chip">${c.queued + c.waiting} to do${c.waiting ? ` (${c.waiting} waiting)` : ''}</span>
        ${c.blocked ? html`<span class="pill blocked">${c.blocked} blocked</span>` : ''}<span class="chip">${c.landed} landed</span>${c.failed ? html`<span class="pill failed">${c.failed} failed</span>` : ''}
      </div>
    </div>
    <div id="tabbody" class="tabbody">
      <div class="flow-wrap">
        <div class="flow-board"><div class="kb-cols">${cols}</div>
          <h3>Plans</h3>
          ${fl.plans.length ? fl.plans.map(planCard) : html`<div class="empty small">No saved plans yet. Ask the boss to plan a goal; its tasks and what can run in parallel show here.</div>`}
        </div>
        ${openGoal ? drawer(openGoal) : ''}
      </div>
    </div>`;
}
function drawer(g) {
  const m = g.model || {};
  return html`<div class="flow-drawer">
    <button class="btn ghost close" data-act="goal" data-id="${g.id}" title="close">✕</button>
    <div class="krow"><span class="kdot ${g.stage}"></span><span class="kid">#${g.id} · ${g.target} · ${g.role}</span></div>
    <h2>${g.title}</h2>
    <div class="dtrack">${g.track.map(t => html`<span class="st ${t.state}">${t.station}</span>`)}</div>
    ${g.description ? html`<div class="dsec"><div class="dlabel">What</div><div class="dtext">${g.description}</div></div>` : ''}
    <div class="dsec"><div class="dlabel">Where it is</div><div class="dtext">${stageWord(g)}${g.task_id ? html`\ntask ${g.task_id}${g.task_status ? ' (' + g.task_status + ')' : ''}` : ''}${g.worker_pid ? html` · worker pid ${g.worker_pid}` : ''}${g.parents.length ? html`\nwaits for ${g.parents.join(', ')}` : ''}${g.branch ? html`\nbranch ${g.branch}` : ''}</div></div>
    ${m.model ? html`<div class="dsec"><div class="dlabel">Model</div><div class="dtext">${m.model}${m.behind_proxy ? html` → ${m.behind_proxy.model} (${m.behind_proxy.tier || 'proxy'}, ${ago(m.behind_proxy.ts)})` : ''}\n<span class="muted">${m.live ? 'live, ' : ''}from the ${m.source}</span></div></div>` : ''}
    ${g.jobs.length ? html`<div class="dsec"><div class="dlabel">Attempts</div>${g.jobs.map(j => html`<div class="krow"><span class="kdot ${j.outcome === 'pass' ? 'landed' : (j.outcome ? 'failed' : 'running')}"></span><span>job ${j.id} · attempt ${j.attempt} · ${j.outcome || 'running'}${j.model ? ' on ' + shortModel(j.model) : ''}</span></div>${j.detail ? html`<div class="dtext small">${j.detail}</div>` : ''}`)}</div>` : ''}
    ${g.detail ? html`<div class="dsec"><div class="dlabel">Outcome</div><div class="dtext">${g.detail}</div></div>` : ''}
    ${g.plan_id ? html`<div class="dsec"><div class="dlabel">Plan</div><div class="dtext">${g.plan_task} of <span title="${g.plan_id}">${g.plan_id.slice(0, 8)}</span></div></div>` : ''}
  </div>`;
}
function planCard(p) {
  const open = planIsOpen(p.id);
  const tasks = new Map(p.tasks.map(t => [t.id, t]));
  const waves = p.waves.map((w, i) => html`<div class="wave">
    <span class="wlabel">${i === 0 ? 'can start together' : `after wave ${i}`}${w.length > 1 ? ` · ${w.length} in parallel` : ''}</span>
    ${w.map(id => { const t = tasks.get(id); return html`<span class="task ${t.stage}" title="${t.title}${t.depends_on.length ? ' · after ' + t.depends_on.join(', ') : ''}"><span class="kdot ${t.stage}"></span>${t.title}<span class="mono">${t.role || ''}${t.model ? ' · ' + shortModel(t.model) : ''}${t.goal_id ? ' · #' + t.goal_id : ''}</span></span>`; })}
  </div>`);
  return html`<div class="plan"${hl('plan:' + p.id)}>
    <div class="rt-head"><span class="kdot plan"></span><span class="ptitle">${p.objective || '(no objective yet)'}</span><span class="chip">${p.target || ''}</span><span class="chip">${p.dispatched}/${p.tasks.length} tasks sent</span><span class="chip">rev ${p.revision}</span><span class="muted small">${ago(p.updated_at || p.created_at)}</span>
      <button class="btn ghost" data-act="plan" data-id="${p.id}" style="font-size:12px;">${open ? 'Hide' : 'Tasks'}</button></div>
    ${open ? (p.tasks.length ? waves : html`<div class="muted small" style="margin-top:6px">No tasks in the contract yet.</div>`) : ''}
  </div>`;
}
// null = the newest plan is open by default; '' = none; otherwise the open plan's id.
function planIsOpen(id) { return S.planOpen === id || (S.planOpen === null && !!S.flow && S.flow.plans.length > 0 && S.flow.plans[0].id === id); }

// ---- Talk tab: the live boss (team/boss_chat.py) ----
function talkView(d) {
  if (S.boss === null && !S.bossErr && !S.bossLoading) loadBoss();
  if (S.bossErr) return html`<div class="empty"><span class="msg err">Can't reach the boss: ${S.bossErr}</span></div>`;
  if (S.boss === null) return html`<div class="empty">Loading…</div>`;
  const b = S.boss, busy = S.bossSending;
  const state = !b.alive ? (b.error ? 'stopped with an error' : (b.started ? 'stopped' : 'not started')) : (b.busy ? 'thinking' : (b.awaiting === 'ask' ? 'asking you' : 'ready'));
  const rows = b.transcript.length
    ? b.transcript.map(e => html`<div class="msg-row ${e.who}"><div class="bubble">${e.tools && e.tools.length ? html`<span class="tools" title="tools the boss used for this answer">used ${toolSummary(e.tools)}</span>` : ''}${e.text}<span class="when" title="${e.ts}">${e.who === 'you' ? 'you' : e.who} · ${ago(e.ts)}</span></div></div>`)
    : html`<div class="empty small">Nothing yet. Describe a goal; the boss plans it with you and sends the parts to the team.</div>`;
  return html`<div class="talk">
    <div class="talk-bar">
      <span class="sdot ${b.alive ? (b.busy ? 'working' : 'active') : 'planned'}"></span>
      <span>${state}</span>
      ${b.busy ? html`<span class="thinking">the boss is working</span>` : ''}
      ${b.session_id ? html`<span class="chip mono" title="Hermes session ${b.session_id}">${String(b.session_id).slice(0, 8)}</span>` : ''}
      ${b.started_at ? html`<span class="chip" title="${b.started_at}">up ${since(b.started_at)}</span>` : ''}
      <span class="spacer"></span>
      ${b.alive
        ? html`<button class="btn ghost" data-act="boss-new"${busy ? raw(' disabled') : ''}>New session</button><button class="btn ghost danger-text" data-act="boss-stop"${busy ? raw(' disabled') : ''}>Stop</button>`
        : html`<button class="btn primary" data-act="boss-start"${busy ? raw(' disabled') : ''}>${busy ? 'Starting…' : (b.session_id ? 'Resume boss' : 'Start boss')}</button>${b.session_id ? html`<button class="btn ghost" data-act="boss-new"${busy ? raw(' disabled') : ''}>New session</button>` : ''}`}
      ${msgHtml(S.msgs['boss:start'] || S.msgs['boss:send'] || S.msgs['boss:stop'] || S.msgs['boss:new'])}
    </div>
    ${b.error ? html`<div class="banner" style="margin-bottom:10px">${b.error}</div>` : ''}
    <div id="talk-log" class="talk-log">${rows}</div>
    <div class="talk-input">
      <textarea class="inp" data-key="boss:input" data-boss="1" placeholder="${b.awaiting === 'ask' ? 'Answer with a number or a sentence' : (b.alive ? 'Tell the boss a goal, or ask it anything. Enter sends, Shift+Enter for a new line.' : 'Type here; your first message starts the boss' + (b.session_id ? ' and resumes the session' : '') + '. Enter sends.')}"${b.busy || busy ? raw(' disabled') : ''}>${S.bossDraft}</textarea>
      <button class="btn primary" data-act="boss-send"${b.busy || busy ? raw(' disabled') : ''}>${b.alive ? 'Send' : (busy ? 'Starting…' : 'Send')}</button>
    </div>
  </div>`;
}

const RENDER = { overview, instructions, skills, tools, hooks, jobs, history: historyTab, settings: settingsView, inbox, runtime: runtimeView, flow: flowView, talk: talkView };

// ---- actions ----
function select(name) {
  if (S.tab === 'runtime' || S.tab === 'flow') S.tab = name === 'boss' ? 'talk' : 'overview';
  if (name !== 'boss' && S.tab === 'talk') S.tab = 'overview';
  if (S.sel !== name) {
    S.sel = name; S.detail = null; S.detailErr = null;
    S.edit = null; S.skillOpen = null; S.newSkill = null; S.ask = null;
    for (const k of Object.keys(S.hl)) if (!k.startsWith('agent:')) delete S.hl[k];
  }
  syncHash(); renderAll(); loadDetail(name);
}
function syncHash() {
  if (S.sel) history.replaceState(null, '', `#${enc(S.sel)}/${S.tab}`);
}
function focusKey(k, selectAll) {
  const el = document.querySelector(`[data-key="${CSS.escape(k)}"]`);
  if (!el) return;
  el.focus();
  if (selectAll && el.select) el.select();
}

function startEdit(field) {
  const d = S.detail, F = FIELDS.find(x => x.f === field);
  const v = get(d.role, field);
  let value = v == null ? '' : String(v);
  if (F.kind === 'select' && !value) value = F.opts(d)[0] || '';
  S.edit = { agent: d.name, field, value, base: v, saving: false };
  delete S.msgs[K('field:' + field)];
  renderPane();
  focusKey('edit:' + field, F.kind === 'text' || F.kind === 'int');
}

async function commitEdit() {
  const e = S.edit;
  if (!e || e.saving) return;
  const F = FIELDS.find(x => x.f === e.field), mk = K('field:' + e.field);
  let value = e.value;
  if (F.kind === 'int') {
    const t = String(value).trim();
    if (!/^\d+$/.test(t)) { setMsg(mk, false, 'must be a whole number'); renderPane(); return; }
    value = Number(t);
  } else if (F.kind !== 'select') {
    value = String(value).trim();
  }
  if (same(value, e.base)) { S.edit = null; renderPane(); return; }
  e.saving = true; delete S.msgs[mk]; renderPane();
  try {
    const res = await api('PATCH', `/api/agents/${enc(e.agent)}/role`, { field: e.field, value });
    S.mine.add(res.sha);
    if (S.edit === e) S.edit = null;
    setMsg(mk, true, 'saved ' + res.sha.slice(0, 7));
    await refresh();
  } catch (err) {
    e.saving = false;
    setMsg(mk, false, err.message);
    renderPane();
    focusKey('edit:' + e.field);
  }
}

// Runs one write; the result's sha is shown next to `mk`, an error inline there.
async function write(mk, fn, onOk) {
  S.busy = mk; delete S.msgs[mk]; renderPane();
  try {
    const res = await fn();
    if (res && res.sha) { S.mine.add(res.sha); setMsg(mk, true, 'saved ' + res.sha.slice(0, 7)); }
    S.busy = null;
    if (onOk) onOk(res);
    await refresh();
  } catch (err) {
    S.busy = null;
    setMsg(mk, false, err.message);
    renderPane();
  }
}

function saveInstr() {
  const d = S.detail, dk = K('instr'), dr = S.drafts[dk];
  if (!dr) return;
  const text = dr.text;
  write(dk, () => api('PUT', `/api/agents/${enc(d.name)}/instructions`, { text }), () => {
    // Saved text becomes the new base; further typing stays a draft.
    if (S.drafts[dk]) S.drafts[dk].base = text;
  });
}

function saveSkill(name) {
  const d = S.detail, dk = K('skill:' + name), dr = S.drafts[dk];
  if (!dr) return;
  const text = dr.text;
  write(dk, () => api('PUT', `/api/agents/${enc(d.name)}/skills/${enc(name)}`, { text }), () => {
    if (S.drafts[dk]) S.drafts[dk].base = text;
  });
}

function addSkill() {
  const d = S.detail, n = S.newSkill, mk = K('new-skill');
  if (!n) return;
  const name = n.name.trim();
  if (!SKILL_RE.test(name)) { setMsg(mk, false, 'name: lowercase letters, digits and dashes, starting with a letter or digit'); renderPane(); return; }
  if (d.skills.some(s => s.name === name)) { setMsg(mk, false, `${name} already exists; open it to edit`); renderPane(); return; }
  write(mk, () => api('PUT', `/api/agents/${enc(d.name)}/skills/${enc(name)}`, { text: n.text }), res => {
    S.newSkill = null; S.skillOpen = name;
    setMsg(K('skill:' + name), true, 'added ' + res.sha.slice(0, 7));
  });
}

function deleteSkill(name) {
  const d = S.detail;
  S.ask = null;
  write(K('hist'), () => api('DELETE', `/api/agents/${enc(d.name)}/skills/${enc(name)}`), () => {
    delete S.drafts[K('skill:' + name)];
    if (S.skillOpen === name) S.skillOpen = null;
  });
}

function revert(sha) {
  const d = S.detail;
  S.ask = null;
  write(K('hist'), () => api('POST', `/api/agents/${enc(d.name)}/revert`, { sha }));
}

function saveTools() {
  const d = S.detail;
  const value = d.available_tools.filter(t => {
    const el = document.querySelector(`input[data-tool="${CSS.escape(t)}"]`);
    return el && el.checked;
  });
  write(K('tools'), () => api('PATCH', `/api/agents/${enc(d.name)}/role`, { field: 'tools', value }));
}

// ---- toasts ----
function toast(text, open) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  if (open) { t.classList.add('link'); t.title = 'Open ' + open; t.addEventListener('click', () => select(open)); }
  box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 250); }, 6000);
}

// ---- events ----
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'open': select(d.name); break;
    case 'tab': S.tab = d.tab; S.ask = null; syncHash(); renderPane(); break;
    case 'settings': S.tab = 'settings'; S.ask = null; S.sel = null; S.edit = null; S.skillOpen = null; S.newSkill = null; syncHash(); renderAll(); loadSettings(); break;
    case 'inbox': S.tab = 'inbox'; S.ask = null; S.sel = null; S.edit = null; S.skillOpen = null; S.newSkill = null; syncHash(); renderAll(); break;
    case 'runtime': S.tab = 'runtime'; S.ask = null; S.sel = null; S.edit = null; S.skillOpen = null; S.newSkill = null; syncHash(); renderAll(); loadRuntime(); break;
    case 'flow': S.tab = 'flow'; S.ask = null; S.sel = null; S.edit = null; S.skillOpen = null; S.newSkill = null; history.replaceState(null, '', '#/flow'); renderAll(); loadFlow(); break;
    case 'goal': S.goalOpen = S.goalOpen === Number(d.id) ? null : Number(d.id); renderPane(); break;
    case 'plan': S.planOpen = planIsOpen(d.id) ? '' : d.id; if (S.tab !== 'flow') { S.tab = 'flow'; S.sel = null; renderAll(); } else renderPane(); break;
    case 'plan-open': S.planOpen = d.id; renderPane(); { const el = document.querySelector('.plan[data-hl], .plan'); } break;
    case 'boss-start': bossAction('start'); break;
    case 'boss-stop': bossAction('stop'); break;
    case 'boss-new': bossAction('new'); break;
    case 'boss-send': { const t = S.bossDraft.trim(); if (t) bossAction('send', { text: t }); break; }
    case 'proposal': S.proposalOpen = S.proposalOpen === d.id ? null : d.id; renderPane(); break;
    case 'session': S.sessionOpen = S.sessionOpen === d.id ? null : d.id; renderPane(); break;
    case 'settings-tab': S.settingsTab = d.tab; renderPane(); break;
    case 'save-setting': {
      const key = d.key;
      const input = el.tagName === 'INPUT' ? el : el.querySelector('input');
      // Only checkboxes save on click; text/number inputs save on Enter via keydown
      if (input.type === 'checkbox') {
        saveSetting(key, input.checked);
      }
      break;
    }
    case 'save-target': {
      const name = d.name;
      const key = d.key;
      const input = el;
      let value;
      if (input.type === 'checkbox') value = input.checked;
      else value = input.value || null;
      saveTargetSetting(name, key, value);
      break;
    }
    case 'edit': startEdit(d.field); break;
    case 'save-instr': saveInstr(); break;
    case 'theirs': delete S.drafts[d.dk]; renderPane(); break;
    case 'skill': S.skillOpen = d.skill; S.newSkill = null; S.ask = null; renderPane(); break;
    case 'new-skill': S.newSkill = { name: '', text: '' }; S.skillOpen = null; renderPane(); focusKey('ns:name'); break;
    case 'cancel-new': S.newSkill = null; delete S.msgs[K('new-skill')]; renderPane(); break;
    case 'add-skill': addSkill(); break;
    case 'save-skill': saveSkill(d.skill); break;
    case 'ask': S.ask = d.ask; renderPane(); break;
    case 'ask-cancel': S.ask = null; renderPane(); break;
    case 'del-skill': deleteSkill(d.skill); break;
    case 'revert': revert(d.sha); break;
    case 'pick-option': {
      const input = document.querySelector(`input[data-act="answer-input"][data-decision="${d.decision}"]`);
      if (input) input.value = d.option;
      break;
    }
    case 'answer': {
      const input = document.querySelector(`input[data-act="answer-input"][data-decision="${d.decision}"]`);
      const text = input ? input.value.trim() : '';
      if (!text) { toast('Enter an answer or pick an option', null); break; }
      answerDecision(d.decision, text);
      break;
    }
    case 'dismiss': {
      // Two-step dismiss: first click shows "Click again to dismiss", second click dismisses
      const btn = el;
      if (btn.dataset.confirming === 'true') {
        dismissDecision(d.decision);
      } else {
        btn.dataset.confirming = 'true';
        const originalText = btn.textContent;
        btn.textContent = 'Click again to dismiss';
        btn.classList.add('danger');
        // Reset after 3 seconds
        setTimeout(() => {
          if (btn.dataset.confirming === 'true') {
            btn.dataset.confirming = 'false';
            btn.textContent = originalText;
            btn.classList.remove('danger');
          }
        }, 3000);
      }
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.edit && S.edit) { S.edit.value = t.value; return; }
  if (t.dataset.draft) {
    const dk = t.dataset.draft;
    const dr = S.drafts[dk] || (S.drafts[dk] = { base: baseFor(dk), text: t.value });
    dr.text = t.value;
    const ed = t.closest('.editor');
    if (ed) ed.classList.toggle('dirty', dr.text !== dr.base);
    return;
  }
  if (t.dataset.ns && S.newSkill) S.newSkill[t.dataset.ns] = t.value;
  if (t.dataset.boss) S.bossDraft = t.value;
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.tool !== undefined) saveTools();
  else if (t.tagName === 'SELECT' && t.dataset.edit) { S.edit.value = t.value; commitEdit(); }
});

document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.boss) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      const text = S.bossDraft.trim();
      if (text && S.boss && !S.boss.busy && !S.bossSending) bossAction('send', { text });
    }
    return;
  }
  if (t.dataset && t.dataset.edit) {
    if (ev.key === 'Escape') { ev.preventDefault(); S.edit = null; renderPane(); }
    else if (ev.key === 'Enter' && !ev.shiftKey && t.tagName !== 'SELECT') { ev.preventDefault(); commitEdit(); }
    return;
  }
  // Settings text/number inputs: Enter saves, Esc restores
  if (t.dataset && t.dataset.act === 'save-setting' && (t.tagName === 'INPUT' && (t.type === 'text' || t.type === 'number'))) {
    const key = t.dataset.key;
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      const f = S.settingsFields.find(x => x.key === key);
      let value = t.value;
      if (f && f.type === 'int') value = Number(value);
      saveSetting(key, value);
      return;
    }
    if (ev.key === 'Escape') {
      ev.preventDefault();
      // Restore from server value
      t.value = S.settings[key] ?? '';
      t.blur();
      return;
    }
  }
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') {
    ev.preventDefault();
    if (S.tab === 'instructions') saveInstr();
    else if (S.tab === 'skills') { if (S.newSkill) addSkill(); else if (S.skillOpen) saveSkill(S.skillOpen); }
    return;
  }
  if (ev.key === 'Escape' && S.ask) { S.ask = null; renderPane(); }
});

window.addEventListener('beforeunload', ev => {
  if (Object.keys(S.drafts).some(isDirty)) { ev.preventDefault(); ev.returnValue = ''; }
});

function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { S.live = true; renderHeader(); };
  es.onerror = () => {
    S.live = false; renderHeader();
    // EventSource retries by itself unless the server refused outright.
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
  };
  es.onmessage = ev => {
    let fp;
    try { fp = JSON.parse(ev.data).fingerprint; } catch (_) { return; }
    if (!S.live) { S.live = true; renderHeader(); }
    if (fp !== S.fp) {
      S.fp = fp; refresh(); loadInbox();
      if (S.tab === 'settings') loadSettings();
      if (S.tab === 'runtime' || S.runtime) loadRuntime();
      loadFlow();
      if (S.tab === 'talk' || S.boss) loadBoss();
    }
  };
}

async function boot() {
  const [h, t] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (t && RENDER[t]) S.tab = t;
  renderAll();
  await Promise.all([loadState(), loadFlow()]);
  if (S.state) {
    const names = S.state.roles.map(r => r.name);
    if (names.includes(h)) select(h);
    else { S.tab = 'flow'; S.sel = null; renderAll(); }
  }
  connect();
  // Keep "job 10 · team · 4m" current between events.
  setInterval(renderStrip, 30000);
}
boot();
</script>
