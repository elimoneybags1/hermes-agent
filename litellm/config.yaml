router_settings:
  enable_pre_call_checks: true
  optional_pre_call_checks:
  - session_affinity
  num_retries: 1
  max_fallbacks: 2
  allowed_fails: 1
  cooldown_time: 300
  fallbacks:
  - tier-simple:
    - tier-medium
  - tier-medium:
    - tier-complex
    - tier-simple
  - tier-complex:
    - tier-reasoning
    - tier-medium
  - tier-reasoning:
    - tier-complex
    - tier-medium
  context_window_fallbacks: []
litellm_settings:
  drop_params: true
  telemetry: false
  callbacks:
  - spend_guard.guard
  - usage_log.logger
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
