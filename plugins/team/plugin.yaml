name: team
version: "0.1.0"
description: "Team's layer inside Hermes: records every model call a profile makes into Team's ledger ($TEAM_STATE/team.db) and marks anything that reached a non-catalog model or an off-gateway URL as a violation, so `team run` can block the task. Opt-in per profile through plugins.enabled; every Team profile enables it."
author: "Team"
kind: standalone
provides_hooks:
  - post_api_request
  - api_request_error
  - pre_tool_call
provides_tools:
  - team_status
  - team_findings
  - team_notes_read
  - team_notes_write
  - team_propose
  - team_proposals
  - team_suggest
  - team_ask
  - team_harness_read
  - team_propose_harness
